<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testes do modelo · FPL Draft</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topo">
  <h1>Testes do modelo</h1>
  <p class="meta" id="resumo">A correr…</p>
</header>
<main>
  <ul class="riscos" id="resultados"></ul>
</main>

<script>window.__TESTES__ = true;</script>
<script src="app.js"></script>
<script>
/* Dados sintéticos: um plantel meu, um de outro gestor e alguns livres.
   Serve para verificar as regras do modelo sem depender da API. */
function jog(id, nome, tipo, equipa, dono, extras) {
  return Object.assign({
    id: id, web_name: nome, first_name: nome, second_name: nome,
    element_type: tipo, team: equipa, owner: dono, draft_rank: id,
    status: "a", news: "", news_added: null, chance_of_playing_next_round: null,
    total_points: 100, minutes: 2700, starts: 30,
    // Preço só existe no modo clássico, mas o planeador do wildcard precisa
    // dele: 5.0M para toda a gente cabe nos 100.0M com folga.
    now_cost: 50, selected_by_percent: "5.0",
  }, extras || {});
}

function historicoSintetico(jogadores) {
  const h = {};
  jogadores.forEach(function (p) {
    h[p.id] = {
      minutes: p.minutes, starts: p.starts, total_points: p.total_points,
      goals_scored: 5, assists: 5, clean_sheets: 8, saves: p.element_type === 1 ? 90 : 0,
      bonus: 10, penalties_saved: 0, yellow_cards: 3, red_cards: 0, own_goals: 0,
      expected_goals: "6.0", expected_assists: "4.0", expected_goals_conceded: "40.0",
      // 360 em 2700 min = 12 por 90, o valor típico de quem chega ao limiar.
      defensive_contribution: p.dc === undefined ? 360 : p.dc, penalties_missed: 0,
    };
  });
  return h;
}

const meus = [
  jog(1, "GR1", 1, 1, 100), jog(2, "GR2", 1, 2, 100),
  jog(3, "DEF1", 2, 1, 100), jog(4, "DEF2", 2, 2, 100), jog(5, "DEF3", 2, 3, 100),
  jog(6, "DEF4", 2, 4, 100), jog(7, "DEF5", 2, 5, 100),
  jog(8, "MED1", 3, 1, 100), jog(9, "MED2", 3, 2, 100), jog(10, "MED3", 3, 3, 100),
  jog(11, "MED4", 3, 4, 100), jog(12, "MED5", 3, 5, 100),
  jog(13, "AV1", 4, 1, 100), jog(14, "AV2", 4, 2, 100), jog(15, "AV3", 4, 3, 100),
];
const deles = [];
for (let i = 0; i < 15; i += 1) {
  deles.push(jog(100 + i, "O" + i, meus[i].element_type, (i % 5) + 1, 200));
}
const livres = [jog(300, "LivreMED", 3, 1, null), jog(301, "LivreDEF", 2, 2, null)];
const todos = meus.concat(deles, livres);

D = {
  league_id: 1,
  generated_at: new Date().toISOString(),
  game: { current_event: null },
  next_event: { id: 1, name: "Gameweek 1", deadline_time: new Date(Date.now() + 36e5).toISOString() },
  entries: [
    { id: 1, entry_id: 100, entry_name: "Buendia Porro", manager: "Bruno Gentil", waiver_pick: 4 },
    { id: 2, entry_id: 200, entry_name: "Rival", manager: "Outro Gestor", waiver_pick: 1 },
  ],
  standings: [], teams: {}, players: todos, fixtures: {}, jornadas: {},
  historico: historicoSintetico(todos), preepoca: {}, transferencias: {}, bolaparada: {},
  ffs: { feed: [], artigo: null, jogadores: {} },
  mercado: { noticias: [], transacoes: [], transferencias_feitas: [] }, conferencias: { clubes: [] },
  regras: {
    scoring: {
      long_play: 2, goals_scored_GKP: 10, goals_scored_DEF: 6, goals_scored_MID: 5,
      goals_scored_FWD: 4, assists: 3, clean_sheets_GKP: 4, clean_sheets_DEF: 4,
      clean_sheets_MID: 1, clean_sheets_FWD: 0, goals_conceded_GKP: -1,
      goals_conceded_DEF: -1, concede_limit: 2, saves: 1, saves_limit: 3,
      penalties_saved: 5, yellow_cards: -1, red_cards: -3, own_goals: -2,
      penalties_missed: -2,
      defensive_contribution_GKP: 0, defensive_contribution_DEF: 2,
      defensive_contribution_MID: 2, defensive_contribution_FWD: 2,
      defensive_contribution_limit_GKP: 0, defensive_contribution_limit_DEF: 10,
      defensive_contribution_limit_MID: 12, defensive_contribution_limit_FWD: 12,
    },
    squad: {
      play: 11, min_play_GKP: 1, max_play_GKP: 1, min_play_DEF: 3, max_play_DEF: 5,
      min_play_MID: 2, max_play_MID: 5, min_play_FWD: 1, max_play_FWD: 3,
    },
  },
};
for (let i = 1; i <= 5; i += 1) D.teams[i] = { name: "Clube " + i, short_name: "C" + i };
jogadoresPorId = Object.fromEntries(todos.map(function (p) { return [p.id, p]; }));
construirPriors();

const falhas = [];
function verificar(nome, condicao, detalhe) {
  const ok = !!condicao;
  if (!ok) falhas.push(nome);
  document.getElementById("resultados").insertAdjacentHTML("beforeend",
    '<li class="risco ' + (ok ? "" : "bad") + '"><div class="linha">' +
      '<span class="nome">' + (ok ? "ok" : "FALHA") + "</span>" +
      '<span class="clube">' + nome + "</span></div>" +
      (ok || detalhe === undefined ? "" : '<ul class="motivos"><li>' + detalhe + "</li></ul>") +
    "</li>");
}

/* --- Onze inicial --- */
const meusX = comProjecao(meus);
const xi = melhorXI(meusX);
const conta = { 1: 0, 2: 0, 3: 0, 4: 0 };
xi.forEach(function (x) { conta[x.p.element_type] += 1; });
verificar("o onze tem 11 jogadores", xi.length === 11, "tem " + xi.length);
verificar("1 guarda-redes exatamente", conta[1] === 1, conta[1]);
verificar("defesas entre 3 e 5", conta[2] >= 3 && conta[2] <= 5, conta[2]);
verificar("médios entre 2 e 5", conta[3] >= 2 && conta[3] <= 5, conta[3]);
verificar("avançados entre 1 e 3", conta[4] >= 1 && conta[4] <= 3, conta[4]);
verificar("limites lidos das regras da liga", limitesXI()[2][1] === 5);

/* --- Ausências --- */
const lesionado = D.players.find(function (p) { return p.web_name === "MED1"; });
const antesLesao = projecao(lesionado).ppj;
lesionado.status = "i";
verificar("lesionado projeta zero", projecao(lesionado).ppj === 0);
verificar("mas recuperado mantém valor", ppjSaudavel(lesionado) > 0.5);
lesionado.status = "a";

D.ffs.jogadores[lesionado.id] = { estado: "fora", frase: "out", clube: "Clube 1" };
verificar("Scout a dar como fora também zera", projecao(lesionado).ppj === 0);
verificar("ppjSaudavel ignora a ausência do Scout", ppjSaudavel(lesionado) > 0.5);
delete D.ffs.jogadores[lesionado.id];
verificar("sem ausência volta ao valor original",
  Math.abs(projecao(lesionado).ppj - antesLesao) < 0.001);

/* --- Pontuação da liga --- */
const gr = D.players.find(function (p) { return p.web_name === "GR1"; });
verificar("golo de guarda-redes vale 10", regraPos("goals_scored", 1, 0) === 10);
verificar("golos sofridos castigam defesas",
  castigoGolosSofridos(2, 1.3) < -0.3 && castigoGolosSofridos(2, 1.3) > -0.6,
  castigoGolosSofridos(2, 1.3));
verificar("avançados não são castigados por golos sofridos",
  castigoGolosSofridos(4, 1.3) === 0);
verificar("guarda-redes ganha pontos com defesas",
  componentesPP90(gr, historicoDe(gr)).defesas > 0);

/* --- Bola parada --- */
const veterano = D.players.find(function (p) { return p.web_name === "MED2"; });
const estreante = D.players.find(function (p) { return p.web_name === "MED3"; });
estreante.minutes = 0;
D.historico[estreante.id].minutes = 0;
D.bolaparada[veterano.id] = { pen: 1, confianca: "alta" };
D.bolaparada[estreante.id] = { pen: 1, confianca: "alta" };
const extraVeterano = pontosBolaParada(veterano, historicoDe(veterano));
const extraEstreante = pontosBolaParada(estreante, historicoDe(estreante));
verificar("cargo de penáltis acrescenta pontos", extraVeterano > 0);
verificar("acréscimo é maior para quem não tem historial",
  extraEstreante > extraVeterano * 2, extraEstreante.toFixed(2) + " vs " + extraVeterano.toFixed(2));
D.bolaparada[veterano.id].confianca = "media";
verificar("confiança média vale metade",
  Math.abs(pontosBolaParada(veterano, historicoDe(veterano)) - extraVeterano / 2) < 0.001);

/* --- Trocas --- */
const delesX = comProjecao(deles);
const antes = valorXI(meusX);
const trocaIgual = valorXI(meusX.filter(function (x) { return x.p.id !== 8; })
  .concat(delesX.filter(function (x) { return x.p.id === 107; })));
verificar("trocar médio por médio mantém o onze legal",
  melhorXI(meusX.filter(function (x) { return x.p.id !== 8; })
    .concat(delesX.filter(function (x) { return x.p.id === 107; }))).length === 11);
verificar("valorXI devolve um número positivo", antes > 0 && trocaIgual > 0);

const sugestoes = sugestoesTrocas(meusX, D.entries[0]);
verificar("sugestões de troca são todas da mesma posição",
  sugestoes.every(function (t) { return t.meu.p.element_type === t.deles.p.element_type; }),
  sugestoes.length + " sugestões");

/* --- Janela do calendário --- */
D.fixtures["1"] = [];   // Clube 1: calendário fácil
D.fixtures["2"] = [];   // Clube 2: calendário difícil
for (let ev = 1; ev <= 10; ev += 1) {
  D.fixtures["1"].push({ event: ev, opponent: 3, is_home: true, difficulty: ev <= 3 ? 1 : 3 });
  D.fixtures["2"].push({ event: ev, opponent: 3, is_home: false, difficulty: ev <= 3 ? 5 : 3 });
}
const facil = D.players.find(function (p) { return p.web_name === "MED4"; });
const dificil = D.players.find(function (p) { return p.web_name === "MED5"; });
facil.team = 1; dificil.team = 2;

function amplitude(n) {
  definirJanela(n);
  return projecao(facil).calFator - projecao(dificil).calFator;
}
const amp3 = amplitude(3);
const amp8 = amplitude(8);
verificar("janela maior dilui a diferença entre calendários", amp8 < amp3,
  "3 jornadas: " + amp3.toFixed(3) + " · 8 jornadas: " + amp8.toFixed(3));

definirJanela(5);
const prFacil = projecao(facil);
verificar("fator do calendário fica perto de 1",
  prFacil.calFator > 0.85 && prFacil.calFator < 1.15, prFacil.calFator.toFixed(3));
verificar("a janela lê o valor guardado", janelaAtual() === 5);
verificar("calendário fácil vale mais do que a taxa base", prFacil.ppjCal > prFacil.ppj);
verificar("calendário difícil vale menos", projecao(dificil).ppjCal < projecao(dificil).ppj);

const ppjAntes = projecao(facil).ppj;
definirJanela(8);
verificar("mudar a janela não mexe nos pts/jornada, só no ajuste",
  Math.abs(projecao(facil).ppj - ppjAntes) < 1e-9);
definirJanela(5);

const semJogos = D.players.find(function (p) { return p.web_name === "AV1"; });
semJogos.team = 99;
const prSem = projecao(semJogos);
verificar("sem calendário, o ajuste é neutro", Math.abs(prSem.ppjCal - prSem.ppj) < 1e-9);
verificar("decaimento faz a próxima jornada pesar mais",
  fatorCalendario([{ event: 5, difficulty: 1 }, { event: 6, difficulty: 5 }], 5) >
  fatorCalendario([{ event: 5, difficulty: 5 }, { event: 6, difficulty: 1 }], 5));
verificar("jogos sem jornada não colapsam numa só",
  Math.abs(fatorCalendario([{ difficulty: 3 }, { difficulty: 3 }], 2) - 1) < 1e-9);

/* --- Projeção nunca negativa --- */
/* --- Contribuição defensiva: um limiar por jogo, não um total --- */
verificar("Poisson: P(X>=0) é 1", Math.abs(probPoissonAtinge(3, 0) - 1) < 1e-9);
verificar("Poisson: media muito abaixo do limiar dá quase zero",
  probPoissonAtinge(2, 12) < 0.001);
verificar("Poisson: media muito acima do limiar dá quase um",
  probPoissonAtinge(30, 10) > 0.99);
verificar("Poisson é monótona na média",
  probPoissonAtinge(8, 10) < probPoissonAtinge(12, 10));

verificar("guarda-redes não recebem contribuição defensiva",
  pontosContribuicaoDefensiva(1, 20) === 0);
verificar("defesa acima do limiar recebe quase os 2 pontos",
  pontosContribuicaoDefensiva(2, 18) > 1.8);
verificar("médio tem limiar mais alto do que o defesa",
  pontosContribuicaoDefensiva(3, 11) < pontosContribuicaoDefensiva(2, 11));
verificar("sem ações defensivas não há pontos",
  pontosContribuicaoDefensiva(2, 0) === 0);

(function () {
  const def = D.players.find(function (x) { return x.element_type === 2; });
  const h = historicoDe(def);
  const com = componentesPP90(def, h);
  const sem = componentesPP90(def, Object.assign({}, h, { defensive_contribution: 0 }));
  verificar("a contribuição defensiva entra no total dos pts/90",
    com.total > sem.total + 0.2, "com " + com.total.toFixed(2) + " vs sem " + sem.total.toFixed(2));
  verificar("e aparece na decomposição do tooltip",
    decomporPP90(com, 0).indexOf("contribuição defensiva") >= 0);
})();

/* --- Estatísticas desta época a entrar no modelo --- */
(function () {
  const base = D.players.find(function (x) { return x.element_type === 3; });
  const semJogos = Object.assign({}, base, { minutes: 0 });
  verificar("sem minutos nesta época, o histórico fica intacto",
    historicoCombinado(semJogos, historicoDe(base)) === historicoDe(base));

  const h = historicoDe(base);
  const comJogos = Object.assign({}, base, {
    minutes: 900, total_points: 50, expected_goals: "5.0", expected_assists: "2.0",
    expected_goals_conceded: "10.0", bonus: 5, saves: 0, penalties_saved: 0,
    yellow_cards: 1, red_cards: 0, penalties_missed: 0, own_goals: 0,
    defensive_contribution: 60,
  });
  const comb = historicoCombinado(comJogos, h);
  verificar("os minutos combinados são os desta época mais o prior",
    comb.minutes === 900 + MIN_PRIOR);
  verificar("com 900 min desta época, ela pesa metade",
    Math.abs(900 / (900 + MIN_PRIOR) - 0.5) < 1e-9);

  // Dois gémeos com os mesmos pontos, um com xG alto e outro sem: o xG decide.
  const comum = { minutes: 450, total_points: 20, bonus: 2, saves: 0,
    penalties_saved: 0, yellow_cards: 0, red_cards: 0, penalties_missed: 0,
    own_goals: 0, defensive_contribution: 30, expected_goals_conceded: "5.0",
    expected_assists: "1.0" };
  const comXG = historicoCombinado(Object.assign({}, base, comum,
    { expected_goals: "5.0" }), h);
  const semXG = historicoCombinado(Object.assign({}, base, comum,
    { expected_goals: "0.0" }), h);
  verificar("com os mesmos pontos, quem tem mais xG projeta mais",
    componentesPP90(base, comXG).total > componentesPP90(base, semXG).total);
})();

/* --- Transferência confirmada sem valor não dá piso de minutos --- */
(function () {
  const alvo = D.players.find(function (x) { return x.element_type === 4; });
  const guardado = D.transferencias;
  const semJogos = { minutes: 0 };
  D.transferencias = { [alvo.id]: { valor: 0, confirmada: true, moeda: "" } };
  const sem = projecao(Object.assign({}, alvo, semJogos));
  D.transferencias = { [alvo.id]: { valor: 60, confirmada: true, moeda: "£" } };
  const caro = projecao(Object.assign({}, alvo, semJogos));
  D.transferencias = guardado;
  verificar("confirmação sem valor não levanta os minutos esperados",
    sem.bump === null, "bump=" + sem.bump);
  verificar("transferência cara continua a levantar",
    caro.xmin >= 75, "xmin=" + caro.xmin.toFixed(1));
})();

/* --- Transferências: pesquisa e ordenação --- */
verificar("acentos não contam na pesquisa", semAcentos("Sánchez") === "sanchez");
verificar("letras que o NFD não decompõe também",
  semAcentos("Nørgaard") === "norgaard" && semAcentos("Đurić") === "duric");
verificar("texto vazio não rebenta", semAcentos(null) === "");

(function () {
  const guardado = D.mercado.transferencias_feitas;
  D.mercado.transferencias_feitas = [
    { jogador: D.players[0].id, titulo: "B sign X", link: "#", data: "2026-08-10T00:00:00Z",
      saiu: false, valor: 0, moeda: "", oficial: true },
    { jogador: D.players[1].id, titulo: "A sign Y", link: "#", data: "2026-08-20T00:00:00Z",
      saiu: false, valor: 40, moeda: "£", oficial: false },
  ];
  const todas = transferenciasFiltradas();
  verificar("mostra as transferências todas por omissão", todas.length === 2);
  D.mercado.transferencias_feitas = guardado;
})();

/* --- Wildcard: o ganho conta-se no onze, não na soma das trocas --- */
(function () {
  if (typeof analiseWildcard !== "function") return;
  const guardado = D.classica;
  // Sem equipa clássica não há análise nenhuma, e não pode rebentar.
  D.classica = undefined;
  verificar("sem equipa clássica, o wildcard não é analisado",
    analiseWildcard([]) === null);
  D.classica = guardado;
})();

/* --- A jornada equipa a equipa: só o onze, e só quem já jogou --- */
(function () {
  const guardadoJ = D.jornadas, guardadoP = D.picks_jornada;
  verificar("sem escolhas da jornada não há tabela", estadoDaJornada() === null);

  const meus = D.players.filter(function (p) { return p.owner === 100; }).slice(0, 15);
  if (meus.length < 12) { D.jornadas = guardadoJ; D.picks_jornada = guardadoP; return; }
  const xi = meus.slice(0, 11).map(function (p) { return p.id; });
  const banco = meus.slice(11).map(function (p) { return p.id; });
  const clubeQueJogou = meus[0].team;
  // Toda a gente do clube 1 já jogou; o resto ainda não.
  D.jornadas = { 3: { finalizada: false, equipas: [clubeQueJogou],
    stats: Object.fromEntries(meus.map(function (p) { return [String(p.id), [90, 7]]; })) } };
  D.picks_jornada = { evento: 3, equipas: { 100: { xi: xi, banco: banco } } };

  const e = estadoDaJornada();
  const linha = e.linhas.find(function (l) { return l.entrada.entry_id === 100; });
  const doClube = meus.slice(0, 11).filter(function (p) { return p.team === clubeQueJogou; });
  verificar("conta os pontos de quem já jogou",
    linha.feitos === doClube.length * 7, "feitos=" + linha.feitos);
  verificar("nenhum jogador do banco aparece por jogar",
    !linha.faltam.some(function (x) { return banco.indexOf(x.p.id) >= 0; }));
  verificar("o onze são no máximo 11 jogadores",
    linha.faltam.length <= 11);
  verificar("quem ainda não jogou aparece por jogar",
    linha.faltam.length === 11 - doClube.length);
  verificar("a previsão soma o que falta ao que já foi",
    Math.abs(linha.previsao - (linha.feitos + linha.porVir)) < 1e-9);
  verificar("as equipas vêm ordenadas pela previsão",
    e.linhas.every(function (l, i) { return i === 0 || e.linhas[i - 1].previsao >= l.previsao; }));

  D.jornadas = guardadoJ; D.picks_jornada = guardadoP;
})();

/* --- A justificação de quem sai tem de bater certo com os números --- */
(function () {
  const faz = (pp90, xmin) => ({ p: { status: "a", web_name: "X" },
    pr: { pp90: pp90, xmin: xmin, ffs: null, naoUsado: false, ultimos: [], pe: null,
          jogosObs: 5 } });
  // O caso real: o Ødegaard rendia MAIS por 90 e a frase dizia "abaixo da
  // alternativa" com os números ao lado a dizer o contrário.
  const texto = porqueSai(faz(4.9, 64), faz(4.4, 80));
  verificar("não afirma que rende menos quando rende mais",
    texto.indexOf("abaixo da alternativa") < 0, texto);
  verificar("diz que o motivo são os minutos",
    /min/.test(texto) && texto.indexOf("64") >= 0 && texto.indexOf("80") >= 0, texto);
  const igual = porqueSai(faz(4.5, 60), faz(4.6, 85));
  verificar("com rendimento igual, aponta os minutos",
    igual.indexOf("mesmo por 90") >= 0, igual);
  const pior = porqueSai(faz(3.0, 80), faz(5.0, 80));
  verificar("quando rende mesmo menos, di-lo com os dois números",
    pior.indexOf("3.0") >= 0 && pior.indexOf("5.0") >= 0, pior);
  verificar("sem alternativa não inventa comparação",
    porqueSai(faz(4.9, 64)).indexOf("alternativa") < 0);
})();

/* --- Trocas de N por N --- */
verificar("combinações de 1 são a própria lista",
  combinacoes([1, 2, 3], 1).length === 3);
verificar("combinações de 2 em 4 são 6", combinacoes([1, 2, 3, 4], 2).length === 6);
verificar("combinações de 3 em 15 são 455",
  combinacoes([...Array(15).keys()], 3).length === 455);
verificar("não repete elementos dentro de uma combinação",
  combinacoes([1, 2, 3, 4], 3).every((g) => new Set(g).size === 3));

verificar("a assinatura de posições ignora a ordem",
  assinaturaPosicoes([{ p: { element_type: 3 } }, { p: { element_type: 2 } }]) ===
  assinaturaPosicoes([{ p: { element_type: 2 } }, { p: { element_type: 3 } }]));
verificar("posições diferentes dão assinaturas diferentes",
  assinaturaPosicoes([{ p: { element_type: 3 } }, { p: { element_type: 3 } }]) !==
  assinaturaPosicoes([{ p: { element_type: 2 } }, { p: { element_type: 3 } }]));

(function () {
  const eu = D.entries[0];
  const meusX = comProjecao(D.players.filter((p) => p.owner === eu.entry_id));
  const trocas = sugestoesTrocas(meusX, eu);

/* --- Calendário: congestão --- */
(function () {
  if (typeof trocosApertados !== "function") return;
  const d = (s) => new Date("2026-10-" + s + "T15:00:00Z").getTime();

  // 3 jogos em 8 dias marca, e a janela é INCLUSIVA: o Arsenal joga a PL a
  // 24/10, a Carabao a 28/10 e a PL a 1/11 — exactamente 8 dias entre o
  // primeiro e o último, e é a semana em que isto vai ser olhado. Com um
  // `< 8` não havia barra nenhuma aí.
  verificar("3 jogos em exactamente 8 dias contam como apertado",
    trocosApertados([{ t: d("01") }, { t: d("05") }, { t: d("09") }]).length === 1);
  verificar("3 jogos em 12 dias não contam",
    trocosApertados([{ t: d("01") }, { t: d("07") }, { t: d("13") }]).length === 0);
  verificar("2 jogos nunca contam",
    trocosApertados([{ t: d("01") }, { t: d("03") }]).length === 0);

  // A barra não é booleana: 5 jogos em 8 dias não é o mesmo que 3.
  const denso = trocosApertados([{ t: d("01") }, { t: d("03") }, { t: d("05") },
                                 { t: d("07") }, { t: d("08") }]);
  verificar("a intensidade do troço é o número de jogos",
    denso.length === 1 && denso[0].jogos === 5, denso);

  // Um jogo que continua a sequência apertada mas começa depois de um troço
  // já fechado não pode ficar órfão. `[0,3,6,9]` dias é uma janela apertada
  // contínua (3,6,9 cabe nos mesmos 8 dias) e tem de sair como UM troço que
  // cobre os quatro jogos — não `[0,6]` com o dia 9 de fora.
  const cobre = (trocos, t) => trocos.some((tr) => tr.inicio <= t && t <= tr.fim);
  const seq4 = [d("01"), d("04"), d("07"), d("10")]; // 0, 3, 6, 9 dias
  const trocos4 = trocosApertados(seq4.map((t) => ({ t })));
  verificar("[0,3,6,9] dias: os quatro jogos ficam cobertos por algum troço",
    seq4.every((t) => cobre(trocos4, t)), trocos4);

  // O mesmo problema, um passo mais longo: cada índice sucessivo tem de
  // alargar o troço em vez de o fechar cedo demais. Cobertura completa,
  // um troço só.
  const seq6 = [d("01"), d("03"), d("05"), d("07"), d("09"), d("11")]; // 0,2,4,6,8,10 dias
  const trocos6 = trocosApertados(seq6.map((t) => ({ t })));
  verificar("[0,2,4,6,8,10] dias: os seis jogos ficam cobertos",
    seq6.every((t) => cobre(trocos6, t)), trocos6);
  verificar("...e saem como um só troço, de intensidade 5",
    trocos6.length === 1 && trocos6[0].jogos === 5, trocos6);

  // Dois grupos apertados mas bem separados no tempo não podem virar um
  // troço só a atravessar o vazio entre eles. Cada grupo repete o padrão
  // órfão de 4 jogos em 9 dias, para também confirmar que a cobertura
  // dentro de cada grupo continua completa quando há mais do que um.
  const doisGrupos = [d("01"), d("04"), d("07"), d("10"), d("21"), d("24"), d("27"), d("30")];
  const trocosDoisGrupos = trocosApertados(doisGrupos.map((t) => ({ t })));
  verificar("dois grupos separados dão dois troços, não um a atravessar o vazio",
    trocosDoisGrupos.length === 2, trocosDoisGrupos);
  verificar("...e nenhum dos oito jogos, nos dois grupos, fica de fora",
    doisGrupos.every((t) => cobre(trocosDoisGrupos, t)), trocosDoisGrupos);
})();

(function () {

  const clube = { jogos: [{ data: d(-4), comp: "PL" }, { data: d(-1), comp: "LC" },
                           { data: d(2), comp: "PL" }] };
  const ate = agora + 30 * 864e5;

    soFuturo.length === 1, soFuturo.length);

    resumoClube(1, soFuturo, {}).apertado === 0, resumoClube(1, soFuturo, {}));

  const alargado = jogosParaApertado(clube, ate);

  verificar("a contagem de jogos futuros (coluna à parte) continua a ignorar o passado",
    resumoClube(1, soFuturo, {}, alargado).jogos === 1);

  // Um clube sem jogos nos 8 dias anteriores não muda de valor.
  const tranquilo = { jogos: [{ data: d(5), comp: "PL" }, { data: d(20), comp: "PL" }] };
  const tranquiloFuturo = jogosNoHorizonte(tranquilo, ate);
  const tranquiloAlargado = jogosParaApertado(tranquilo, ate);
  verificar("clube sem jogos recentes: a janela alargada não traz nada de novo",
    tranquiloAlargado.length === tranquiloFuturo.length,
    [tranquiloFuturo.length, tranquiloAlargado.length]);
  verificar("...e o apertado fica o mesmo com ou sem a janela alargada",
    resumoClube(1, tranquiloFuturo, {}).apertado ===
    resumoClube(1, tranquiloFuturo, {}, tranquiloAlargado).apertado);

/* --- Calendário: fimDoHorizonte ancora em jornadas, não em semanas --- */
(function () {
  if (typeof fimDoHorizonte !== "function" || typeof definirHorizonte !== "function" ||
    typeof horizonteAtual !== "function") return;
  const guardadoC = C;
  const agora = Date.now();
  // +1 dia de folga antes do primeiro jogo: fimDoHorizonte() volta a chamar
  // Date.now() lá dentro, um instante depois deste `agora` ser capturado — a
  // folga evita que essa diferença de milissegundos empurre o primeiro jogo
  // para "o passado" e o exclua do horizonte (flakiness apanhada ao correr
  // este teste — falhava de vez em quando sem a folga).
  const dia = (n) => new Date(agora + (1 + n) * 864e5).toISOString();
  // Um só clube, 20 jornadas futuras (11 a 30), uma a cada 3 dias — dá
  // controlo total sobre que jornada cai em cada horizonte.
  const jogos = [];
  for (let k = 0; k < 20; k += 1) {
    jogos.push({ data: dia(3 * k), comp: "PL", dif: 3, jornada: 11 + k });
  }
  C = { clubes: { "1": { nome: "A", curto: "AAA", jogos: jogos } },
    competicoes: { PL: "Premier League" }, recusados: {} };

  definirHorizonte("6");

  const ate6 = fimDoHorizonte();
  // 6 jornadas a partir da 11: jornadas 11-16, ou seja os primeiros 6 jogos
  // (k=0..5) — o último é k=5, a 1+3*5=16 dias (com a folga de +1 dia).
  verificar("horizonte de 6 jornadas pára no último jogo da 6.ª jornada, não em semanas",
    ate6 === agora + 16 * 864e5, (ate6 - agora) / 864e5);

  definirHorizonte("12");
  const ate12 = fimDoHorizonte();
  // 12 jornadas: jornadas 11-22, k=0..11, último a 1+3*11=34 dias.
  verificar("horizonte de 12 jornadas vai mais longe do que o de 6",
    ate12 === agora + 34 * 864e5 && ate12 > ate6, (ate12 - agora) / 864e5);

  definirHorizonte("resto");
  const ateResto = fimDoHorizonte();
  // Resto da época: o jogo mais tardio conhecido — k=19, a 1+3*19=58 dias.
  verificar("resto da época vai até ao jogo mais tardio conhecido",
    ateResto === agora + 58 * 864e5 && ateResto > ate12, (ateResto - agora) / 864e5);

  // Valor inválido em localStorage cai no valor por omissão, como janelaAtual().
  try { localStorage.setItem("calHorizonte", JSON.stringify("nonsense")); } catch (e) {}
  verificar("um valor inválido guardado cai no horizonte por omissão",
    horizonteAtual() === "12");

  definirHorizonte("12");
  C = guardadoC;
})();

(function () {
  // Medido em 655 jogadores (prever a J3 a partir das J1-J2): quem fez (0,1)
  // tem 86.5% de probabilidade de ser titular a seguir e quem fez (1,1) tem
  // 86.6% — iguais. A diferença real de minutos é +4.5 [-3.4, +12.4] e o
  // modelo assumia +20.6, fora do intervalo. Depois de uma titularidade, o
  // zero anterior não diz nada sobre o jogo seguinte.
  const guardadoJ = D.jornadas;
  const sempre = D.players.find(function (p) { return p.web_name === "DEF1"; });
  const ganhou = D.players.find(function (p) { return p.web_name === "DEF2"; });
  const perdeu = D.players.find(function (p) { return p.web_name === "DEF3"; });
  const misto = D.players.find(function (p) { return p.web_name === "DEF4"; });
  // Mesmo histórico nos quatro, para só os minutos desta época os separarem.
  [sempre, ganhou, perdeu, misto].forEach(function (p) {
    D.historico[p.id].minutes = 2700;
    D.historico[p.id].starts = 30;
  });
  const jornada = function (min) {
    const s = {};
    [sempre, ganhou, perdeu, misto].forEach(function (p, i) { s[String(p.id)] = [min[i], 3]; });
    return { finalizada: true, equipas: [], stats: s };
  };
  //                     sempre ganhou perdeu misto
  D.jornadas = { 1: jornada([90, 0, 90, 0]),
                 2: jornada([90, 90, 0, 45]),
                 3: jornada([90, 90, 0, 90]) };

  const x = function (p) { return projecao(p).xmin; };
  verificar("quem ganhou o lugar deixa de ser castigado pelo zero anterior",
    Math.abs(x(ganhou) - x(sempre)) < 0.01, [x(ganhou), x(sempre)]);
  verificar("quem perdeu o lugar não é promovido pela regra",
    x(perdeu) < x(sempre) - 20, [x(perdeu), x(sempre)]);
  // O 45 quebra a sequência: uma entrada do banco não é tomar posse do lugar,
  // por isso o zero de antes continua a contar.
  verificar("um jogo a meio-gás não apaga o zero anterior",
    x(misto) < x(sempre) - 5, [x(misto), x(sempre)]);
  // Não chega a 90: o histórico continua a puxar pelo `peso` n/(n+2), e é
  // suposto continuar — a regra tira um castigo, não acrescenta um bónus.
  verificar("um titular estabelecido continua perto de um jogo inteiro",
    x(sempre) > 80, x(sempre));

  D.jornadas = guardadoJ;
})();

/* --- O adversário no tooltip, e só no tooltip --- */
(function () {
  const guardadoF = D.fixtures;
  const gr = D.players.find(function (p) { return p.web_name === "GR1"; });
  const def = D.players.find(function (p) { return p.web_name === "DEF1"; });
  const med = D.players.find(function (p) { return p.web_name === "MED1"; });
  const prox = D.next_event.id;
  const comDif = function (d) {
    const f = {};
    [gr, def, med].forEach(function (p) {
      f[String(p.team)] = [{ event: prox, opponent: 9, is_home: false, difficulty: d }];
    });
    return f;
  };

  D.fixtures = comDif(5);
  const ppjAntes = projecao(gr).ppj;
  const duro = projecao(gr).advCS;
  verificar("adversário duro baixa a baliza a zero mostrada",
    duro && duro.csAdv < duro.csBase, duro && [duro.csAdv, duro.csBase]);
  verificar("e devolve parte em defesas ao guarda-redes",
    duro && duro.deltaDefesas > 0 && duro.deltaBaliza < 0,
    duro && [duro.deltaBaliza, duro.deltaDefesas]);
  verificar("a compensação das defesas não chega a anular o castigo",
    duro && duro.deltaBaliza + duro.deltaDefesas < 0);

  D.fixtures = comDif(2);
  const facil = projecao(gr).advCS;
  verificar("adversário fácil sobe a baliza a zero mostrada",
    facil && facil.csAdv > facil.csBase, facil && [facil.csAdv, facil.csBase]);

  // A promessa central: isto é ecrã, não modelo. Medido que mexer no onze por
  // causa disto vale 0.9 pts numa época e o remédio óbvio até o piora.
  verificar("o adversário NÃO mexe na projeção",
    Math.abs(projecao(gr).ppj - ppjAntes) < 1e-9, [projecao(gr).ppj, ppjAntes]);

  D.fixtures = comDif(5);
  verificar("defesas também recebem o efeito", projecao(def).advCS !== null);
  // Nos médios e avançados o efeito do adversário está no ataque, não na
  // baliza a zero — concentrá-lo aqui seria trocar um erro por outro.
  verificar("médios não recebem, porque neles o efeito está no ataque",
    projecao(med).advCS === null);
  verificar("a frase do tooltip diz que não está na projeção",
    frasePorAdversario(projecao(gr).advCS).indexOf("Não está na projeção") > 0);

  // Dificuldade 3 tem multiplicador 1: a linha sairia "47% em vez de 47%
  // (+0.00 pts)", que é ruído com ar de informação.
  D.fixtures = comDif(3);
  verificar("adversário neutro não gera uma linha que não diz nada",
    frasePorAdversario(projecao(gr).advCS) === "",
    frasePorAdversario(projecao(gr).advCS));

  D.fixtures = guardadoF;
})();

verificar("nenhuma projeção é negativa",
  D.players.every(function (p) { return projecao(p).ppj >= 0; }));

document.getElementById("resumo").textContent = falhas.length
  ? falhas.length + " teste(s) a falhar: " + falhas.join(", ")
  : "Tudo a passar (" + document.querySelectorAll("#resultados li").length + " verificações).";
document.getElementById("resumo").style.color = falhas.length ? "var(--perigo)" : "var(--acento)";
</script>
